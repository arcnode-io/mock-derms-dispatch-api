local:
  logLevel: INFO
  # Reason: 8081, not 8080 — der-control-api's local block also defaults to 8080 and looks for this
  # service at localhost:8081, which is also what publicBaseUrl below advertises. Running both
  # locally on 8080 collided and left der-control-api posting subscriptions into nothing.
  port: 8081
  host: 127.0.0.1
  e2e: false
  mqttBrokerUrl: tcp://localhost:1883
  mqttUsername: arcnode_mock_derms_dispatch_api
  siteId: local_site
  publicBaseUrl: http://localhost:8081
  nominalLineVoltageKv: 13.8
  triggerMarginAmps: 50.0
  maxEventDurationHours: 4.0
  dlrDeviceId: dlr_rtu_demo
  ercotTokenUrl: https://ercotb2c.b2clogin.com/ercotb2c.onmicrosoft.com/B2C_1_PUBAPI-ROPC-FLOW/oauth2/v2.0/token
  ercotArchiveUrl: https://api.ercot.com/api/public-reports/archive/np3-562-cd
  # Arbitrary, not "pending review" -- no physical derivation exists (IEEE 738 sizing was tried;
  # the weather-driven delta is already in the live DLR reading, re-adding it here double-counts
  # it) and no empirical one does either until paired zone-stress/outcome history starts
  # accumulating against LiveLoadingSubscriber's real telemetry. See Config's javadoc.
  zoneStressThresholdMw: 1800.0
  zoneStressMarginBoostAmps: 25.0
  envelopeScheduleEnabled: true

beta: &beta
  logLevel: INFO
  port: 8080
  host: 0.0.0.0
  e2e: true
  # The utility's own broker, not the EMS one: a DERMS has no business holding
  # credentials on the plant's broker, and this service only ever reads the DLR
  # feed and its own line loading. Plain, unauthenticated, demo-only — the EMS
  # broker stays File-RBAC and carries sites/... exclusively.
  mqttBrokerUrl: tcp://mock-derms-broker:1883
  mqttUsername: mock_derms_dispatch_api
  siteId: beta_site
  publicBaseUrl: http://mock-derms-dispatch-api:8080
  nominalLineVoltageKv: 13.8
  triggerMarginAmps: 50.0
  maxEventDurationHours: 4.0
  dlrDeviceId: dlr_rtu_demo
  ercotTokenUrl: https://ercotb2c.b2clogin.com/ercotb2c.onmicrosoft.com/B2C_1_PUBAPI-ROPC-FLOW/oauth2/v2.0/token
  ercotArchiveUrl: https://api.ercot.com/api/public-reports/archive/np3-562-cd
  # Arbitrary -- see local block's comment above and Config's javadoc.
  zoneStressThresholdMw: 1800.0
  zoneStressMarginBoostAmps: 25.0
  envelopeScheduleEnabled: true

# The full device demo: this service inside the compose stack, driven by a real DLR rating and line
# loading, so a curtailment runs end to end. Merged from beta for the container hostnames rather than
# copied, so the two cannot drift. Two overrides: siteId matches every other service's device-demo
# block and the HMI's, and a six-minute window lets an event reach its natural end (COMPLETED) during
# a demo instead of four hours later. siteId is snake_case per ADR-002 §9 — the identifier
# regex allows no hyphens.
device-demo:
  <<: *beta
  siteId: device_demo_site
  maxEventDurationHours: 0.1
